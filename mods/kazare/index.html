        .sticky-header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; transform: translateY(-100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s; opacity: 0; border-bottom: 0.5px solid var(--line); }
        .sticky-header.active { transform: translateY(0); opacity: 1; }
        .sticky-left { display: flex; align-items: center; gap: 12px; }
        .sticky-info { display: flex; align-items: center; gap: 10px; }

        @media (prefers-color-scheme: dark) { .sticky-dl-btn { background: #3a3a3c; } }

        .hero { position: relative; height: 240px; background: center/cover no-repeat; display: flex; align-items: flex-end; }
        .hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, var(--grad-color) 100%); }

        .download-btn:active { opacity: 0.7; }
        .download-btn.disabled { background: var(--btn-disabled); pointer-events: none; }

        .ss-container { display: flex; overflow-x: auto; gap: 14px; margin: 20px -20px 30px -20px; padding: 0 20px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }

        .app-row { display: flex; align-items: center; width: 82vw; max-width: 460px; padding: 8px 0; border-bottom: 0.5px solid var(--line); scroll-snap-align: start; text-decoration: none; color: inherit; }

        .author-link { color: var(--btn-blue) !important; text-decoration: none; font-weight: 600; font-size: 0.85rem; }

        .contact-btn { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: var(--card-bg); border-radius: 12px; text-decoration: none; margin-bottom: 10px; font-weight: 600; }

        .contact-btn.telegram { color: var(--btn-blue) !important; }
        .contact-btn .arrow { color: var(--secondary-text); font-weight: normal; }

    <div class="container">

            <div>
                <div class="version-wrapper">
                    <p class="version-num" id="js-version">v---</p>
                    <button id="js-old-ver-toggle" class="old-ver-toggle">▽</button>
                    <div id="js-old-ver-menu" class="old-ver-menu"></div>
                    <span id="js-status" class="status-badge-inline status-available">Available</span>
                </div>
                <div id="js-author-list" class="author-section"></div>
                <p style="font-size: 0.8rem; margin: 6px 0 0; color: var(--secondary-text);" id="ui-updated">Last Updated: --</p>
            </div>

        <div class="ss-container" id="js-ss-container"></div>
        
        <h2 style="font-size: 1.2rem; font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 15px;" id="ui-info-heading">Information</h2>
        <div id="js-info-content" style="line-height: 1.6; color: var(--secondary-text);">Loading...</div>
        
        <div id="js-sns-area" style="margin-bottom: 25px;"></div>
        <div id="js-contact-area" style="margin-top:25px;"></div>

        <div id="js-more-by-section" class="store-section" style="display:none;">
            <div class="section-title" id="js-more-by-title">---</div>
            <div class="app-list-scroll" id="js-more-by-list"></div>
        </div>

        <div id="js-suggested-section" class="store-section" style="display:none;">
            <div class="section-title" id="js-suggested-title">---</div>
            <div class="app-list-scroll" id="js-suggested-list"></div>

        <div style="height:50px;"></div>

    <script>
        (function() {
            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                document.body.style.fontFamily = '-apple-system, BlinkMacSystemFont, sans-serif';
            }
        })();

        const config = { isDebug: true };

        function getInitialLang() {
            const lang = navigator.language || navigator.userLanguage;
            if (lang.startsWith('ja')) return 'ja';
            if (lang.startsWith('zh')) return 'zh';
            return 'en';
        }

        let currentLang = getInitialLang();
        const params = new URLSearchParams(window.location.search);
        
        // パスから codename を自動取得（URLパラメータ ?id= があればそれを優先）
        function getCodename() {
            const urlId = params.get('id');
            if (urlId) return urlId;
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            const modsIndex = pathSegments.indexOf('mods');
            if (modsIndex !== -1 && pathSegments[modsIndex + 1]) {
                return pathSegments[modsIndex + 1];
            }
            return null;
        }

        const codename = getCodename();
        const targetVer = params.get('v');

        const uiText = {
            ja: { available: "利用可能", updated: "最終更新: ", download: "ダウンロード", unsupported: "非対応", moreBy: "{name}の他のアプリ", suggested: "おすすめ", get: "入手", info: "情報", share: "共有" },
            zh: { available: "可用", updated: "最后更新: ", download: "下载", unsupported: "不支持", moreBy: "{name} 的更多应用", suggested: "为您推荐", get: "获取", info: "信息", share: "分享" },
            en: { available: "Available", updated: "Last Updated: ", download: "DOWNLOAD", unsupported: "Unsupported", moreBy: "More by {name}", suggested: "You Might Also Like", get: "Get", info: "Information", share: "Share" }
        };

        if (config.isDebug) {
            const btn = document.createElement('div');
            btn.id = 'debug-lang-tool';
            btn.textContent = `Lang: ${currentLang.toUpperCase()}`;
            btn.onclick = () => { 
                if (currentLang === 'ja') currentLang = 'zh';
                else if (currentLang === 'zh') currentLang = 'en';
                else currentLang = 'ja';

                btn.textContent = `Lang: ${currentLang.toUpperCase()}`;
                initPage();
            };
            document.getElementById('debug-container').appendChild(btn);
        }

        function getOS() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "android";
            if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return "ios";
            return "pc";
        }

        async function initPage() {
            if(!codename) return;
            const device = getOS();
            const resDir = `../../resources/${codename}`;
            const t = uiText[currentLang];
            
            document.getElementById('ui-info-heading').textContent = t.info;

            try {
                const vRes = await fetch(`${resDir}/version.json?${new Date().getTime()}`);
                const vData = await vRes.json();
                const primaryAuthor = vData.authors[0];
                
                const latestVer = vData.version;
                document.getElementById('ui-main-title').textContent = vData.name;
                document.getElementById('js-sticky-name').textContent = vData.name;
                document.getElementById('js-sticky-icon').src = `${resDir}/icon.png`;
                document.getElementById('js-main-icon').src = `${resDir}/icon.png`;
                document.getElementById('js-hero').style.backgroundImage = `url('${resDir}/header.png')`;
                document.getElementById('ui-updated').innerHTML = `<span>${t.updated}</span>${vData.lastUpdated}`;
                document.getElementById('js-status').textContent = t.available;

                const dlArea = document.getElementById('js-dl-area');
                const stickyBtn = document.getElementById('js-sticky-dl-btn');

                function updateToVersion(verName, url, platName) {
                    const fullVer = verName.startsWith('v') ? verName : 'v' + verName;
                    document.getElementById('js-version').textContent = fullVer;
                    document.getElementById('ui-main-title').textContent = vData.name + " " + fullVer;
                    document.getElementById('js-sticky-name').textContent = vData.name + " " + fullVer;
                    
                    const isDisabled = !url;
                    if (isDisabled) {
                        dlArea.innerHTML = `<a class="download-btn disabled" href="#">${t.unsupported}</a>`;
                        stickyBtn.style.display = "none";
                    } else {
                        dlArea.innerHTML = `<a class="download-btn" href="${url}" target="_blank">${t.download} ${fullVer} (${platName})</a>`;
                        stickyBtn.href = url;
                        stickyBtn.style.display = "block";
                        stickyBtn.textContent = t.get;
                    }
                }

                let initialPlat = (device === "ios") ? "iOS" : "Android";
                let initialUrl = (device === "ios") ? vData.iosDownloadUrl : vData.androidDownloadUrl;
                if (!initialUrl || initialUrl === "") {
                    if (vData.androidDownloadUrl) { initialPlat = "Android"; initialUrl = vData.androidDownloadUrl; }
                    else if (vData.iosDownloadUrl) { initialPlat = "iOS"; initialUrl = vData.iosDownloadUrl; }
                }

                if (targetVer) {
                    const cleanT = targetVer.replace(/^v/, '');
                    const iosO = vData.iosoldver || {};
                    const andO = vData.androidoldver || {};
                    if (iosO[targetVer] || iosO[cleanT]) { initialUrl = iosO[targetVer] || iosO[cleanT]; initialPlat = "iOS"; }
                    else if (andO[targetVer] || andO[cleanT]) { initialUrl = andO[targetVer] || andO[cleanT]; initialPlat = "Android"; }
                }
                updateToVersion(latestVer, initialUrl, initialPlat);

                const ssContainer = document.getElementById('js-ss-container');
                ssContainer.innerHTML = '';
                [1,2,3].forEach(n => {
                    const img = document.createElement('img');
                    img.src = `${resDir}/ss${n}.png`;
                    img.onerror = () => img.style.display = "none";
                    ssContainer.appendChild(img);
                });

                const menu = document.getElementById('js-old-ver-menu');
                menu.innerHTML = '';
                let totalItems = 0;

                const createSection = (title, items, plat) => {
                    const validItems = items ? Object.entries(items).filter(([v, u]) => u && u.trim() !== "") : [];
                    if (validItems.length > 0) {
                        const label = document.createElement('div');
                        label.className = 'menu-label'; label.textContent = title;
                        menu.appendChild(label);
                        validItems.forEach(([v, u]) => {
                            totalItems++;
                            const item = document.createElement('div');
                            item.className = 'old-ver-item'; item.textContent = v;
                            item.onclick = () => { updateToVersion(v, u, plat); menu.classList.remove('show'); toggleBtn.classList.remove('active'); };
                            menu.appendChild(item);
                        });
                    }
                };

                const iosLatest = vData.iosDownloadUrl ? { [vData.version]: vData.iosDownloadUrl } : null;
                const androidLatest = vData.androidDownloadUrl ? { [vData.version]: vData.androidDownloadUrl } : null;

                createSection("iOS (Latest)", iosLatest, "iOS");
                createSection("iOS (Older)", vData.iosoldver, "iOS");
                createSection("Android (Latest)", androidLatest, "Android");
                createSection("Android (Older)", vData.androidoldver, "Android");

                const toggleBtn = document.getElementById('js-old-ver-toggle');
                if (totalItems > 1 || (vData.oldVersions && vData.oldVersions.length)) {
                    if (vData.oldVersions?.length) {
                        vData.oldVersions.forEach(ov => {
                            const item = document.createElement('div');
                            item.className = 'old-ver-item'; item.textContent = ov.version;
                            item.onclick = () => { window.location.href = ov.url; };
                            menu.appendChild(item);
                        });
                    }
                    toggleBtn.style.display = "flex";
                    toggleBtn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('show'); toggleBtn.classList.toggle('active'); };
                    window.onclick = () => { menu.classList.remove('show'); toggleBtn.classList.remove('active'); };
                } else {
                    toggleBtn.style.display = "none";
                }

                const authorListEl = document.getElementById('js-author-list');
                authorListEl.innerHTML = '';
                vData.authors.forEach((a, index) => {
                    const link = document.createElement('a');
                    link.href = `../../dev/?id=${a.id}`; link.className = 'author-link'; link.textContent = a.name;
                    authorListEl.appendChild(link);
                    if (index < vData.authors.length - 1) {
                        authorListEl.appendChild(document.createTextNode(', '));
                    }
                });

                const snsArea = document.getElementById('js-sns-area');
                snsArea.innerHTML = '';

                if (navigator.share) {
                    const shareBtn = document.createElement('button');
                    shareBtn.className = 'download-btn';
                    shareBtn.style.background = 'var(--btn-gray)';
                    shareBtn.style.color = 'var(--btn-blue)';
                    shareBtn.style.border = 'none';
                    shareBtn.style.width = '100%';
                    shareBtn.style.cursor = 'pointer';
                    shareBtn.textContent = t.share;
                    shareBtn.onclick = () => {
                        navigator.share({
                            title: document.title,
                            url: window.location.href
                        }).catch(console.error);
                    };
                    snsArea.appendChild(shareBtn);
                }

                const contactArea = document.getElementById('js-contact-area');
                contactArea.innerHTML = '';
                if (vData.discord) contactArea.innerHTML += `<a href="${vData.discord}" target="_blank" class="contact-btn discord"><span>Discord Server</span><span class="arrow">›</span></a>`;
                if (vData.telegram) contactArea.innerHTML += `<a href="${vData.telegram}" target="_blank" class="contact-btn telegram"><span>Telegram Channel</span><span class="arrow">›</span></a>`;

                const infoContentEl = document.getElementById('js-info-content');
                const getInfoHtml = async () => {
                    const paths = [
                        `${resDir}/info_${currentLang}_${device}.html`, 
                        `${resDir}/info_${currentLang}.html`,
                        `${resDir}/info_en_${device}.html`,
                        `${resDir}/info_en.html`
                    ];
                    for (const path of paths) {
                        try {
                            const res = await fetch(path);
                            if (res.ok && res.headers.get('content-type')?.includes('text/html')) {
                                const txt = await res.text();
                                if (!txt.includes('404 File not found') && !txt.toLowerCase().includes('<title>404')) return txt;
                            }
                        } catch (e) {}
                    }
                    return null;
                };

                const infoHtml = await getInfoHtml();
                if (infoHtml && infoHtml.trim()) {
                    infoContentEl.innerHTML = infoHtml;
                } else {
                    infoContentEl.innerHTML = `<p style="color:var(--secondary-text); font-size:0.85rem; font-style:italic;">No information yet.</p>`;
                }

                const [apps, prods] = await Promise.all([
                    fetch(`../../apps.json`).then(r => r.json()).catch(() => []),
                    fetch(`../../prod.json`).then(r => r.json()).catch(() => [])
                ]);
                const combined = [...apps, ...prods];
                const moreList = document.getElementById('js-more-by-list');
                const sugList = document.getElementById('js-suggested-list');
                moreList.innerHTML = ''; sugList.innerHTML = '';
                
                document.getElementById('js-more-by-title').textContent = t.moreBy.replace('{name}', primaryAuthor.name);
                document.getElementById('js-suggested-title').textContent = t.suggested;

                combined.forEach(async (app) => {
                    const id = app.id || app.codename;
                    if (!id || id === codename) return;
                    
                    try {
                        const itemV = await fetch(`../../resources/${id}/version.json`).then(r => r.json());
                        const desc = itemV.meta?.[currentLang]?.desc || itemV.meta?.en?.desc || "";
                        const html = `<a href="../${id}/" class="app-row"><img src="../../resources/${id}/icon.png" loading="lazy"><div class="app-info"><div class="app-name">${itemV.name}</div><div class="app-desc">${desc}</div></div><div class="get-small-btn">${t.get}</div></a>`;
                        
                        if (itemV.authors?.some(a => a.id === primaryAuthor.id)) {
                            moreList.insertAdjacentHTML('beforeend', html);
                            document.getElementById('js-more-by-section').style.display = 'block';
                        } else {
                            sugList.insertAdjacentHTML('beforeend', html);
                            document.getElementById('js-suggested-section').style.display = 'block';
                        }
                    } catch(e){}
                });

            } catch (e) { console.error(e); }

            window.onscroll = () => {
                const scrollY = window.scrollY;
                document.getElementById('ui-main-title').style.opacity = Math.max(1 - (scrollY / 150), 0);
                const h = document.getElementById('js-sticky-header');
                if (scrollY > 150) h.classList.add('active');
                else h.classList.remove('active');
            };
        }
        window.onload = initPage;
    </script>
</body>
</html>
